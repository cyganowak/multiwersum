name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            make
      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          qmake6 "CONFIG+=release" "CONFIG-=debug_and_release" ../multiwersum.pro
          mingw32-make -j2
          exe=$(find . -name multiwersum.exe | head -1)
          windeployqt "$exe" --qmldirs ../src
      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter multiwersum.exe | Select-Object -First 1
          mkdir stage
          Copy-Item "$($exe.DirectoryName)\*" stage -Recurse
          Compress-Archive -Path stage\* -DestinationPath multiwersum-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: multiwersum-windows-x64.zip

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --repo=repo flatpak-app flatpak/com.github.cyganowak.multiwersum.json
      - name: Bundle
        run: flatpak build-bundle --user repo multiwersum.flatpak com.github.cyganowak.multiwersum stable
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: multiwersum.flatpak

  release:
    needs: [windows, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            multiwersum-windows-x64.zip
            multiwersum.flatpak
          generate_release_notes: true
