name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            make
      - name: Build
        shell: msys2 {0}
        run: |
          mkdir -p build && cd build
          qmake6 "CONFIG+=release" "CONFIG-=debug_and_release" ../multiwersum.pro
          make -j2
          exe=$(find . -name multiwersum.exe | head -1)
          d=$(dirname "$exe")
          windeployqt "$exe"
          # MinGW runtime DLLs: windeployqt skips toolchain libs — copy explicitly
          for r in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            cp "/ucrt64/bin/$r" "$d/"
          done
          # MSYS2 windeployqt lacks QML deployment — copy the QML modules manually
          mkdir -p "$d/qml"
          for m in QtCore QtQml QtQuick QtNetwork; do
            cp -r "$(qmake6 -query QT_INSTALL_QML)/$m" "$d/qml/"
          done
          printf '[Paths]\nQml2Imports = qml\n' > "$d/qt.conf"
          # windeployqt also misses the dependency closure (pcre2/icu/freetype/...).
          # Resolve it transitively with objdump and copy from /ucrt64/bin.
          SYS='^(KERNEL32|USER32|GDI32|GDI32|SHELL32|OLE32|OLEAUT32|ADVAPI32|WS2_32|IMM32|MPR|VERSION|WINMM|CRYPT32|SECUR32|NTDLL|DWRITE|DWMAPI|SHCORE|UXTHEME|SETUPAPI|USERENV|DBGHELP|IPHLPAPI|WINTRUST|BCRYPT|POWRPROF|PDH|WTSAPI32|NETAPI32|NORMALIZ|CFGMGR32|MSVCRT|AUTHZ|DNSAPI|WINHTTP|D3D9|D3D11|D3D12|DXGI|OPENGL32|GLU32|COMDLG32|WINSPOOL|RPCRT4|WINSCARD|SENSAPI|MMDEVICE|PROPSYS|SXS|CSUSER32|ONESTCORE|BCPM4|SORTOS|USP10|MSIMG32|OLEACC|UIAUTOMATIONCORE|FWPUCLNT|IPHLPAPI|NSI|WPR|XINPUT|HID)[.]dll$'
          done=""; stack=$(ls "$d"/Qt6*.dll "$exe")
          while [ -n "$stack" ]; do
            cur=$stack; stack=""
            for f in $cur; do
              case " $done " in *" $f "*) continue;; esac
              done="$done $f"
              for imp in $(objdump -p "$f" 2>/dev/null | awk '/DLL Name/{print $3}'); do
                echo "$imp" | grep -qiE "$SYS" && continue
                t=$(find /ucrt64/bin -maxdepth 1 -iname "$imp" | head -1)
                if [ -n "$t" ]; then
                  if ! [ -f "$d/$imp" ]; then cp "$t" "$d/"; fi
                  stack="$stack $t"
                else
                  echo "UNRESOLVED: $f -> $imp" >&2; exit 1
                fi
              done
            done
          done
      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter multiwersum.exe | Select-Object -First 1
          mkdir stage
          Copy-Item "$($exe.DirectoryName)\*" stage -Recurse
          Compress-Archive -Path stage\* -DestinationPath multiwersum-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: multiwersum-windows-x64.zip

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --repo=repo flatpak-app flatpak/com.github.cyganowak.multiwersum.json
      - name: Bundle
        run: flatpak build-bundle repo multiwersum.flatpak com.github.cyganowak.multiwersum stable
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: multiwersum.flatpak

  release:
    needs: [windows, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            multiwersum-windows-x64.zip
            multiwersum.flatpak
          generate_release_notes: true
